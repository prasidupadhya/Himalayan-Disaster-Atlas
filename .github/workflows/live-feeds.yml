name: Live feed publication
on:
  schedule:
    # Every three hours, off the hour. USGS summaries are shown as fresh for six hours and the GFS field for twelve.
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-live-data-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          # The write token is not left in .git/config while dependencies install or external data is processed.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - run: npm ci --include=dev --workspaces --include-workspace-root
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.lock
      - run: npm run contracts:check
      - name: Restore the published live branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          node scripts/restore-live-branch.mjs
      - name: Acquire and atomically validate source snapshots
        run: npm run live:fetch -- --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Publish data branch only
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          node scripts/publish-live-branch.mjs
      # The site is static: a publication becomes visible when a deployment build imports it. Committing the
      # publication's commit SHA to main records exactly which data each deployment shows and starts that build.
      - name: Pin the publication on main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_SHA: ${{ steps.publish.outputs.sha }}
          GIT_AUTHOR_NAME: Prasid
          GIT_AUTHOR_EMAIL: 91832812+prasidupadhya@users.noreply.github.com
          GIT_COMMITTER_NAME: Prasid
          GIT_COMMITTER_EMAIL: 91832812+prasidupadhya@users.noreply.github.com
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          [[ "$LIVE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "No publication to pin."; exit 1; }
          # Main may have moved (the daily digest also commits); retry on the newest main rather than fail.
          for attempt in 1 2 3; do
            git fetch --no-tags --depth 1 origin main
            git checkout --quiet --detach FETCH_HEAD
            printf '{\n  "commit": "%s"\n}\n' "$LIVE_SHA" > data/live-pin.json
            git add data/live-pin.json
            if git diff --cached --quiet; then echo "This publication is already pinned."; exit 0; fi
            git commit --quiet -m "Update live conditions for $(date -u '+%F %H:%M') UTC"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "Could not pin the publication on main."; exit 1
