name: Manual live feed publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-live-data-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - run: npm ci --include=dev --workspaces --include-workspace-root
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.lock
      - run: npm run contracts:check && node scripts/restore-live-branch.mjs
      - name: Acquire and atomically validate source snapshots
        run: npm run live:fetch -- --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Publish data branch only
        run: node scripts/publish-live-branch.mjs
