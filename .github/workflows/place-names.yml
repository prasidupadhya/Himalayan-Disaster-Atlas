# Acquires the official source of the Nepali district names. Runs by hand, or when this pipeline changes.
name: place-names
on:
  workflow_dispatch:
  push:
    paths:
      - pipelines/place_names/**
      - .github/workflows/place-names.yml
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pdftotext
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Fetch the constitution
        env:
          GOV_PROXY: ${{ secrets.GOV_PROXY }}
        run: python pipelines/place_names/acquire.py build/place-names
      - name: Show Schedule 4
        run: |
          pdfinfo build/place-names/constitution.pdf | grep -E "Title|Pages|Producer|CreationDate"
          cat build/place-names/schedule-4.txt
      - uses: actions/upload-artifact@v4
        with:
          name: place-names-source
          path: build/place-names/
