name: Manual research air quality review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_RESEARCH_OPENAQ == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.lock
      - name: Validate research-only provider readings
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: .venv/bin/python -m pipelines.atlas_pipeline.live_air_quality --enable-research
      # Research outputs stay on this disposable runner: no public artifact, live-data/main push or deploy.
