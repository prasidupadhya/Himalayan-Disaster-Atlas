name: Daily official-source digest
on:
  schedule:
    # 00:17 UTC is 06:02 Nepal time.
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gov-digest
  cancel-in-progress: false
jobs:
  digest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The digest gives up on silent hosts and stops starting sources after 10 minutes, so it always
    # reaches the commit step; sources it could not read keep their last copy, marked as such.
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - run: python -m venv .gov && .gov/bin/pip install -r pipelines/gov_feeds/requirements.txt
      - name: Install the browser for pages built by JavaScript
        run: .gov/bin/python -m playwright install --with-deps chromium
      - name: Test the digest
        run: .gov/bin/python -m unittest tests.python.test_gov_feeds -v
      - name: Fetch and organise official pages
        timeout-minutes: 18
        run: .gov/bin/python -m pipelines.gov_feeds.digest
      - name: Commit as the repository owner
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Prasid
          GIT_AUTHOR_EMAIL: 91832812+prasidupadhya@users.noreply.github.com
          GIT_COMMITTER_NAME: Prasid
          GIT_COMMITTER_EMAIL: 91832812+prasidupadhya@users.noreply.github.com
        run: |
          git add apps/web/public/gov data/gov-feeds
          if git diff --cached --quiet; then echo "No change in the official sources."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Update official-source digest for $(TZ=Asia/Kathmandu date +%F)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Run the quality checks on the new commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main
