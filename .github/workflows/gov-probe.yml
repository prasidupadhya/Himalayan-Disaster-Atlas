name: Official-source reachability probe
# Manual diagnostic: which agency hosts answer GitHub's runners, over IPv4 and IPv6, and how.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ vars.GOV_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Probe hosts
        env:
          GOV_PROXY: ${{ secrets.GOV_PROXY }}
        run: |
          UA="HimalayanDisasterAtlas/1.0 (+https://github.com/prasidupadhya/Himalayan-Disaster-Atlas; reachability probe)"
          for url in \
            https://bipadportal.gov.np/robots.txt \
            "https://bipadportal.gov.np/api/v1/alert/?format=json&limit=1" \
            https://dms2.dhm.gov.np/ \
            https://dhm.gov.np/ \
            https://www.dhm.gov.np/ \
            https://dhm.gov.np/mfd/ \
            https://hydrology.gov.np/ \
            https://ndrrma.gov.np/ \
            https://seismonepal.gov.np/robots.txt \
            http://bipadportal.gov.np/robots.txt \
            http://dhm.gov.np/ ; do
            host=$(echo "$url" | awk -F/ '{print $3}')
            echo "=== $url"
            echo "dns A: $(dig +short A "$host" | tr '\n' ' ') | AAAA: $(dig +short AAAA "$host" | tr '\n' ' ')"
            for fam in -4 -6; do
              curl $fam -sS -o /dev/null -A "$UA" --connect-timeout 12 --max-time 25 \
                -w "curl $fam: http=%{http_code} ip=%{remote_ip} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" "$url" 2>&1 | tail -1
            done
            if [ -n "$GOV_PROXY" ]; then
              # Through the configured proxy; curl's errors can name the proxy, so they are not printed.
              curl -sS -o /dev/null -A "$UA" --proxy "$GOV_PROXY" --connect-timeout 12 --max-time 25 -w "via proxy: http=%{http_code} total=%{time_total}s\n" "$url" 2>/dev/null || echo "via proxy: failed"
            fi
          done
          echo "=== runner egress"; curl -sS --max-time 10 https://api.ipify.org; echo
