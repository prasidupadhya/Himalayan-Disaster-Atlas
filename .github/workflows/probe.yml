name: probe
on:
  push:
    branches: [fix/gov-feed-routes]
    paths: [.github/probe/**, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: PYTHONPATH=. python .github/probe/probe.py
