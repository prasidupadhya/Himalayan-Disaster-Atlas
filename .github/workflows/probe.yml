name: probe
on:
  push:
    branches: [fix/gov-feed-routes]
    paths: [.github/probe/**, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - run: pip install -q -r pipelines/gov_feeds/requirements.txt && python -m playwright install --with-deps chromium >/dev/null
      - run: python .github/probe/probe.py
